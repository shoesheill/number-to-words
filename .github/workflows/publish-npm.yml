name: Publish npm Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/number-to-words

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set version from git tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sync package version with tag
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm
        shell: bash
        run: |
          set -o pipefail

          for attempt in 1 2 3 4 5; do
            echo "npm publish attempt ${attempt}/5"

            if npm publish --access public 2>&1 | tee /tmp/npm-publish.log; then
              exit 0
            fi

            if ! grep -qE 'E409|Failed to save packument' /tmp/npm-publish.log; then
              exit 1
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "npm registry returned E409 after 5 attempts."
              exit 1
            fi

            delay=$((attempt * 30))
            echo "Transient npm E409 detected; retrying in ${delay}s."
            sleep "$delay"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
