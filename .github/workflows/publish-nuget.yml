name: Publish NuGet Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # C# project, assembly, namespace, and package identity are all .NET-free.
      PACKAGE_ID: NumberToWords.Core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version from git tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore NumberToWords.sln

      - name: Build
        run: dotnet build NumberToWords.sln --configuration Release --no-restore -p:Version="$VERSION"

      - name: Pack
        run: dotnet pack src/NumberToWords/NumberToWords.csproj --configuration Release --no-build -p:Version="$VERSION" -p:PackageId="$PACKAGE_ID" -p:PackageReleaseNotes="Release $VERSION" --output ./nupkg

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/${PACKAGE_ID}.${VERSION}.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ env.VERSION }}
          path: ./nupkg/
